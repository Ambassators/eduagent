name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and package Electron voice app
        run: npm run dist:mac -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Voice-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win -- --x64
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Voice-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
