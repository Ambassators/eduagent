name: Prepare desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate release version
        shell: bash
        run: |
          node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if (!/^v\d+\.\d+\.\d+$/.test(process.env.GITHUB_REF_NAME) || process.env.GITHUB_REF_NAME !== `v${p.version}`) throw Error("Run on a stable v<package.json version> tag.");'
      - run: npm test
      - name: Validate native package architecture
        run: node -e "const assert = require('node:assert/strict'); assert.equal(process.arch, '${{ matrix.arch }}'); require.resolve('@openai/codex-' + process.platform + '-' + process.arch + '/package.json'); require.resolve('@napi-rs/canvas'); require('@napi-rs/canvas').createCanvas(1, 1);"
      - name: Configure macOS signing
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            test -n "$CSC_KEY_PASSWORD" || { echo 'Set MAC_CSC_KEY_PASSWORD for the configured signing certificate.'; exit 1; }
            echo 'MAC_SIGNING_ARGS=--config.forceCodeSigning=true' >> "$GITHUB_ENV"
          else
            # Ad-hoc sign so the bundle seal is valid; otherwise Gatekeeper reports the download as "damaged".
            echo 'MAC_SIGNING_ARGS=--config.mac.identity=- --config.mac.hardenedRuntime=false' >> "$GITHUB_ENV"
            echo 'macOS packages are ad-hoc signed and must be opened via System Settings > Privacy & Security > Open Anyway.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build update packages and manifests
        shell: bash
        run: |
          for signing_var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!signing_var}" ]; then unset "$signing_var"; fi
          done
          npm run dist:${{ matrix.platform }} -- --${{ matrix.arch }} ${{ env.MAC_SIGNING_ARGS }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Omit update manifest for unsigned macOS packages
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK" ]; then rm -f release/latest-mac.yml; fi
      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.blockmap
            !release/builder-*.yml
  draft:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: update-*
          path: packages
      - name: Combine packages and signed Mac update manifests
        run: node scripts/prepare-release-assets.mjs packages release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
